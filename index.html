<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src https://generativelanguage.googleapis.com; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FoodApp">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f9d6b">
<title>FoodApp - บันทึกอาหาร</title>
<style>
:root{
  --bg:#f4f6f5; --surface:#ffffff; --surface2:#eef2f0; --text:#16201b; --muted:#5d6b64; --line:#dde4e0;
  --accent:#1f9d6b; --accent-ink:#ffffff; --warn:#d9480f; --danger:#c92a2a;
  --p:#3b6fe0; --f:#c77700; --c:#0f8a73; --ex:#8a4fd6;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1512; --surface:#18211c; --surface2:#202b25; --text:#e8f0ec; --muted:#9bafa5; --line:#2b3831;
    --accent:#38c48a; --accent-ink:#06130d; --warn:#ff8c5a; --danger:#ff6b6b;
    --p:#7aa2ff; --f:#f5b04a; --c:#4cd0b4; --ex:#c19bff;
    --shadow:0 1px 3px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI","Leelawadee UI","Noto Sans Thai",Tahoma,sans-serif;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.25rem;margin:0}
h2{font-size:1.05rem;margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface2);padding:10px 14px;border-radius:12px;min-height:44px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.ghost{background:transparent}
.btn.block{display:block;width:100%}
.btn.small{min-height:36px;padding:6px 12px}
.btn.left{text-align:left}
.btn:disabled{opacity:.55;cursor:not-allowed}
.icon-btn{border:none;background:transparent;font-size:1.3rem;padding:8px;min-width:44px;min-height:44px;border-radius:10px}
.icon-btn:hover{background:var(--surface2)}
label.fld{display:block;font-size:.85rem;color:var(--muted);margin-bottom:10px}
input,select,textarea{
  font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;width:100%;min-height:44px;margin-top:4px;
}
input:focus,select:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{resize:vertical;min-height:70px}
input[type=checkbox]{width:22px;height:22px;min-height:22px;margin:0;padding:0;flex:none;accent-color:var(--accent)}
label.check{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:.9rem;min-height:44px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;gap:4px}
nav .tab{border:none;background:transparent;padding:6px;border-radius:12px;display:flex;flex-direction:column;align-items:center;font-size:.78rem;color:var(--muted);min-height:48px}
nav .tab .ic{font-size:1.35rem;line-height:1.2}
nav .tab.on{color:var(--accent);font-weight:700}
.fab{justify-self:center;width:58px;height:58px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-ink);font-size:1.8rem;margin-top:-22px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.ring{width:150px;height:150px;flex:none}
.ring-bg{fill:none;stroke:var(--surface2);stroke-width:12}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .4s}
.ring-fg.over{stroke:var(--warn)}
.ring text{fill:var(--text);text-anchor:middle}
.mbar{margin:8px 0}
.mbar .top{display:flex;justify-content:space-between;font-size:.88rem}
.mbar .track{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:4px}
.mbar .fill{height:100%;border-radius:99px}
.meal{display:flex;gap:12px;align-items:flex-start}
.thumb{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--surface2);flex:none;display:flex;align-items:center;justify-content:center;font-size:1.8rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:.78rem;padding:2px 8px;border-radius:99px;background:var(--surface2)}
.chip.p{color:var(--p)} .chip.f{color:var(--f)} .chip.c{color:var(--c)} .chip.ex{color:var(--ex)}
.date-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.notice{border-radius:12px;padding:10px 12px;font-size:.88rem;background:var(--surface2);border-left:4px solid var(--accent);margin:10px 0}
.notice.warn{border-left-color:var(--warn)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.95rem}
.kv b{font-variant-numeric:tabular-nums}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.item label{font-size:.72rem;color:var(--muted)}
.item .grid4 input,.item .grid3 input{padding:8px 6px;text-align:center}
.preview{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin:10px 0 0}
.pstrip{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
.pimg{position:relative;flex:none}
.pimg img{width:120px;height:120px;object-fit:cover;border-radius:12px;display:block}
.pimg button{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:.9rem}
.spinner{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;max-width:90%;font-size:.9rem}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.hidden{display:none!important}
.sub{font-size:.8rem;color:var(--muted);margin:14px 0 6px;font-weight:600}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:14px 2px 6px}
.coach p{margin:8px 0}
.coach ul{margin:2px 0 8px;padding-left:20px}
.coach li{margin:3px 0;font-size:.93rem}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:8px;padding:0 10px}
details summary{cursor:pointer;padding:11px 2px;font-weight:600;font-size:.92rem;min-height:44px}
.favrow{display:flex;gap:4px;align-items:center;margin-bottom:8px}
.favrow .btn{line-height:1.3}
/* reports */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface2);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{border:none;background:transparent;padding:8px;border-radius:9px;min-height:40px}
.seg button.on{background:var(--surface);font-weight:700;box-shadow:var(--shadow)}
.chart{width:100%;height:auto;display:block}
.chart .bar{fill:var(--accent)} .chart .bar.over{fill:var(--warn)}
.chart.pro .bar{fill:var(--p)} .chart.pro .bar.low{opacity:.35}
.score{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.score:last-of-type{border-bottom:0}
.score .muted{grid-column:2 / 4;font-size:.78rem;margin-top:-2px}
details.rep{padding:0 14px;margin:0 0 12px}
details.rep[open]{padding-bottom:12px}
.chart .tgt{stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}
.chart text{fill:var(--muted);font-size:9px}
.stack{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--surface2);margin:6px 0}
.drow{display:grid;grid-template-columns:1.3fr 1fr .8fr .8fr .8fr 1fr;gap:4px;width:100%;text-align:right;border:none;background:transparent;border-bottom:1px solid var(--line);padding:9px 2px;font-size:.85rem;font-variant-numeric:tabular-nums;min-height:44px;align-items:center}
.drow>:first-child{text-align:left}
.drow.head{color:var(--muted);font-size:.74rem;cursor:default}
.drow.today{font-weight:700}
.brow{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);font-size:.88rem;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav>
  <div class="in">
    <button class="tab" data-act="tab" data-tab="today"><span class="ic">📊</span>วันนี้</button>
    <button class="tab" data-act="tab" data-tab="report"><span class="ic">📈</span>สรุป</button>
    <button class="fab" data-act="add" aria-label="เพิ่มบันทึก">＋</button>
    <button class="tab" data-act="tab" data-tab="profile"><span class="ic">⚙️</span>โปรไฟล์</button>
  </div>
</nav>
<div id="modal"></div>
<input type="file" id="fileCam" accept="image/*" capture="environment" class="hidden">
<input type="file" id="fileLib" accept="image/*" multiple class="hidden">
<input type="file" id="fileImp" accept="application/json,.json" class="hidden">

<script>
"use strict";
/* ============ helpers ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
const r0 = n => Math.round(n);
const r1 = n => Math.round(n * 10) / 10;
const sgn = v => (v > 0 ? "+" : "") + r1(v);
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const pad = n => String(n).padStart(2, "0");
const dateKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const timeNow = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const parseKey = key => { const [y, m, d] = key.split("-").map(Number); return new Date(y, m - 1, d); };
const shiftDate = (key, delta) => { const dt = parseKey(key); return dateKey(new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() + delta)); };
const byTime = (a, b) => (a.time || "").localeCompare(b.time || "");
const DAYS = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
const DAYS_S = ["อา","จ","อ","พ","พฤ","ศ","ส"];
const MONS = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const MONS_L = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
function fmtDate(key) { const dt = parseKey(key); return `${DAYS[dt.getDay()]} ${dt.getDate()} ${MONS[dt.getMonth()]} ${dt.getFullYear() + 543}`; }
const fmtShort = key => { const dt = parseKey(key); return `${dt.getDate()} ${MONS[dt.getMonth()]}`; };
let toastTimer;
function toast(msg) {
  document.querySelectorAll(".toast").forEach(e => e.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.remove(), 3500);
}

/* ============ store (localStorage, with in-memory fallback) ============ */
const K = { profile: "foodapp.profile", settings: "foodapp.settings", log: "foodapp.log", ex: "foodapp.ex", coach: "foodapp.coach", body: "foodapp.body", fav: "foodapp.fav" };
const mem = {};
const store = {
  get(k, d) {
    if (k in mem) return mem[k];
    try { const v = localStorage.getItem(k); if (v) return JSON.parse(v); } catch (e) {}
    return d;
  },
  set(k, v) {
    mem[k] = v;
    try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; }
  }
};
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}

/* ============ calc (pure) ============ */
const ACTIVITY = [
  [1.2, "นั่งทำงานเป็นหลัก แทบไม่ออกกำลังกาย (×1.2)"],
  [1.375, "ออกกำลังกายเบา 1–3 วัน/สัปดาห์ (×1.375)"],
  [1.55, "ออกกำลังกายปานกลาง 3–5 วัน/สัปดาห์ (×1.55)"],
  [1.725, "ออกกำลังกายหนัก 6–7 วัน/สัปดาห์ (×1.725)"],
  [1.9, "หนักมาก / งานใช้แรงงาน + ออกกำลังกาย (×1.9)"]
];
function compute(p) {
  const w = num(p.weight), bf = num(p.bf), h = num(p.height), a = num(p.age);
  if (w <= 0) return null;
  const lbm = bf > 0 && bf < 70 ? w * (1 - bf / 100) : null;
  let bmr = null, method = "";
  if (lbm) { bmr = 370 + 21.6 * lbm; method = "Katch-McArdle (ใช้ %FAT)"; }
  else if (h > 0 && a > 0) { bmr = 10 * w + 6.25 * h - 5 * a + (p.sex === "female" ? -161 : 5); method = "Mifflin-St Jeor (ไม่มี %FAT)"; }
  const ov = num(p.tdeeOverride);
  const tdee = ov > 0 ? ov : (bmr ? bmr * num(p.activity || 1.375) : null);
  if (!tdee) return null;
  const deficit = clamp(num(p.deficit), 0, 40) / 100;
  const kcal = r0(tdee * (1 - deficit));
  const ppk = clamp(num(p.protPerKg) || 2.0, 1.2, 3.0);
  const protein = r0(w * ppk);
  const fat = r0(Math.max(kcal * 0.25 / 9, 0.6 * w));
  const carb = r0(Math.max(0, (kcal - protein * 4 - fat * 9) / 4));
  let weeks = null, fatToLose = null;
  const tb = num(p.targetBf);
  if (lbm && tb > 0 && tb < bf) {
    fatToLose = w - lbm / (1 - tb / 100);
    const daily = tdee - kcal;
    if (daily > 0) weeks = fatToLose * 7700 / daily / 7;
  }
  return { lbm, bmr, method, tdee, kcal, protein, fat, carb, deficit, weeks, fatToLose, usedOverride: ov > 0 };
}

/* ============ state ============ */
const DEFAULT_PROFILE = { sex: "male", age: "", height: "", weight: "", bf: "", targetBf: "", activity: 1.375, tdeeOverride: "", deficit: 20, protPerKg: 2.0 };
const state = {
  tab: "today",
  date: dateKey(),
  rep: { range: "week", anchor: dateKey() },
  profile: Object.assign({}, DEFAULT_PROFILE, store.get(K.profile, {})),
  settings: loadSettings(),
  log: store.get(K.log, {}),     // { date: [ {id,time,type,thumb,items:[{name,portion,kcal,p,f,c,fib,sug,na}]} ] }
  ex: store.get(K.ex, {}),       // { date: [ {id,time,type,name,minutes,kcal,detail,thumb} ] }
  coach: store.get(K.coach, {}), // { "YYYY-MM-DD" | "week:YYYY-MM-DD" | "month:YYYY-MM-DD": {sig,at,headline,score,good[],improve[],next} }
  body: store.get(K.body, {}),   // { date: {w, bf} }
  fav: store.get(K.fav, []),     // [ {id,name,items} ]
  coachRun: {}, coachErrs: {}, coachSeq: 0,
  draft: null,
  pickMode: "food"
};
const zeroT = () => ({ kcal: 0, p: 0, f: 0, c: 0, fib: 0, sug: 0, na: 0 });
const addT = (a, b) => ({ kcal: a.kcal + b.kcal, p: a.p + b.p, f: a.f + b.f, c: a.c + b.c, fib: a.fib + b.fib, sug: a.sug + b.sug, na: a.na + b.na });
const itemsTotals = items => items.reduce((a, i) => addT(a, { kcal: num(i.kcal), p: num(i.p), f: num(i.f), c: num(i.c), fib: num(i.fib), sug: num(i.sug), na: num(i.na) }), zeroT());
const mealTotals = m => itemsTotals(m.items);
const dayTotals = d => (state.log[d] || []).reduce((a, m) => addT(a, mealTotals(m)), zeroT());
const exTotals = d => (state.ex[d] || []).reduce((a, e) => {
  a.n++; a.min += num(e.minutes); a.kcal += num(e.kcal);
  if (e.type === "cardio") { a.cn++; a.cmin += num(e.minutes); } else if (e.type === "weights") { a.wn++; a.wmin += num(e.minutes); }
  return a;
}, { n: 0, min: 0, kcal: 0, cn: 0, cmin: 0, wn: 0, wmin: 0 });
const hasData = d => (state.log[d] || []).length > 0 || (state.ex[d] || []).length > 0;
const EXTYPE = { cardio: ["🏃", "คาร์ดิโอ"], weights: ["🏋️", "เวทเทรนนิ่ง"], other: ["⚡", "อื่นๆ"] };
/* meal types */
const MTYPES = [["b", "🌅", "เช้า"], ["l", "☀️", "กลางวัน"], ["d", "🌙", "เย็น"], ["s", "🍪", "ของว่าง"]];
const MT = Object.fromEntries(MTYPES.map(x => [x[0], x]));
function typeFromTime(t) {
  const [h, m] = String(t || "12:00").split(":").map(Number), x = (h || 0) * 60 + (m || 0);
  return x >= 240 && x < 630 ? "b" : x >= 630 && x < 900 ? "l" : x >= 1020 && x < 1320 ? "d" : "s";
}
const mealType = m => MT[m.type] ? m.type : typeFromTime(m.time);
const mealName = m => m.items.map(i => i.name).filter(Boolean).join(", ") || (m.pending ? "รอ AI วิเคราะห์" : "อาหาร");

/* persistence — if storage is full, drop thumbnails of entries older than 14 days and retry */
function compactThumbs() {
  const cutoff = dateKey(new Date(Date.now() - 14 * 864e5));
  [state.log, state.ex].forEach(col => Object.keys(col).forEach(d => { if (d < cutoff) col[d].forEach(m => { m.thumb = ""; }); }));
}
function persist(key, val) {
  if (store.set(key, val)) return true;
  compactThumbs();
  if (store.set(key, val)) { toast("พื้นที่เต็ม: ลบรูปย่อของรายการเก่ากว่า 14 วันแล้ว"); return true; }
  toast("บันทึกลงเครื่องไม่ได้ (พื้นที่เต็มหรือปิด Local Storage) ลอง Export สำรองข้อมูล"); return false;
}
const saveLog = () => persist(K.log, state.log);
const saveEx = () => persist(K.ex, state.ex);

/* ============ image helpers ============ */
function loadImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("เปิดไฟล์รูปไม่ได้")); };
    img.src = url;
  });
}
function scaled(img, maxSide, q) {
  const k = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", q);
}
const MAX_IMG = 4;

/* ============ Gemini ============ */
const GEM = "https://generativelanguage.googleapis.com/v1beta";
function gemError(status, msg) {
  const base = gemErrorBase(status, msg || "");

async function analyzeFood(images, hint, mode) {

      kcal: r0(num(i.kcal)), p: r1(num(i.protein_g)), f: r1(num(i.fat_g)), c: r1(num(i.carb_g)),
      fib: r1(num(i.fiber_g)), sug: r1(num(i.sugar_g)), na: r0(num(i.sodium_mg))

/* ============ render: reports ============ */
function chartSvg(days, vals, target, range, minMode) {   // minMode: เป้าเป็น "ขั้นต่ำ" (เช่น โปรตีน) — ถึงเป้า = สีเต็ม, ไม่ถึง = จาง
  const W = 340, H = 150, pl = 4, pr = 4, pt = 12, pb = 22, n = days.length, bw = (W - pl - pr) / n;
  const max = Math.max(target || 0, ...vals, minMode ? 50 : 500) * 1.12;
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  let s = `<svg class="chart ${minMode ? "pro" : ""}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${minMode ? "กราฟโปรตีนรายวัน" : "กราฟแคลอรี่รายวัน"}">`;
  vals.forEach((v, i) => {
    const x = pl + i * bw + bw * 0.15, w = bw * 0.7, dt = parseKey(days[i]);
    const cls = minMode ? (target && v < target * 0.9 ? "low" : "") : (target && v > target ? "over" : "");
    if (v > 0) s += `<rect class="bar ${cls}" x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${w.toFixed(1)}" height="${(H - pb - y(v)).toFixed(1)}" rx="2"/>`;
    const show = range === "week" || i === 0 || (i + 1) % 5 === 0;
    if (show) s += `<text x="${(x + w / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${range === "week" ? DAYS_S[dt.getDay()] : dt.getDate()}</text>`;
  });
  if (target) s += `<line class="tgt" x1="${pl}" x2="${W - pr}" y1="${y(target).toFixed(1)}" y2="${y(target).toFixed(1)}"/><text x="${W - pr}" y="${(y(target) - 3).toFixed(1)}" text-anchor="end">เป้า ${target}</text>`;
  return s + "</svg>";
}
function lineSvg(pts, color, target, label) {   // pts: [{d, v}] sorted by date

  const x = d => pts.length === 1 ? (pl + W - pr) / 2 : pl + (W - pl - pr) * (parseKey(d).getTime() - t0) / span;
  const y = v => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟ${label}">`;
  const yl = y(last.v) + 3; let yt = target > 0 ? y(target) + 3 : 0;
  if (target > 0) {
    if (Math.abs(yt - yl) < 10) yt = yl + (yt >= yl ? 10 : -10);
    s += `<line class="tgt" x1="${pl}" x2="${W - pr}" y1="${y(target).toFixed(1)}" y2="${y(target).toFixed(1)}"/><text x="${W - pr + 4}" y="${yt.toFixed(1)}">เป้า ${target}</text>`;
  }
  if (pts.length > 1) s += `<polyline fill="none" style="stroke:${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p => x(p.d).toFixed(1) + "," + y(p.v).toFixed(1)).join(" ")}"/>`;
  pts.forEach(p => { s += `<circle cx="${x(p.d).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3" style="fill:${color}"/>`; });
  s += `<text x="${W - pr + 4}" y="${yl.toFixed(1)}" style="fill:var(--text);font-weight:700;font-size:10px">${r1(last.v)}</text>`;
  s += `<text x="${pl}" y="${H - 5}">${fmtShort(pts[0].d)}</text>`;
  if (pts.length > 1) s += `<text x="${W - pr}" y="${H - 5}" text-anchor="end">${fmtShort(last.d)}</text>`;

}

/* ---- scorecard (traffic light) ---- */
const light = r => r >= 0.8 ? "🟢" : r >= 0.5 ? "🟡" : "🔴";
function scoreCardHtml(days, t) {
  const tk = dateKey(), past = days.filter(d => d <= tk);

  const logged = past.filter(d => (state.log[d] || []).length).length;
  const rows = [];
  const row = (dot, label, val, note) => rows.push(`<div class="score"><span>${dot}</span><span>${label}</span><b>${val}</b>${note ? `<span class="muted">${note}</span>` : ""}</div>`);
  if (t && judged.length) {
    const floor = t.bmr ? t.bmr * 0.9 : t.kcal * 0.75;
    const okK = judged.filter(d => { const k = dayTotals(d).kcal; return k <= t.kcal * 1.05 && k >= floor; }).length;
    const lowK = judged.filter(d => dayTotals(d).kcal < floor).length;
    row(light(okK / judged.length), "แคลอรี่อยู่ในเป้า", `${okK}/${judged.length} วัน`, `ไม่เกิน ${r0(t.kcal * 1.05)} kcal${lowK ? ` · กินน้อยเกินไป ${lowK} วัน (ต่ำกว่า ${r0(floor)})` : ""}`);

    row(light(okP / judged.length), "โปรตีนถึงเป้า", `${okP}/${judged.length} วัน`, `อย่างน้อย ${r0(t.protein * 0.9)} g/วัน`);
  }

  row(light(logged / past.length), "วันที่บันทึกอาหาร", `${logged}/${past.length} วัน`, "บันทึกครบ ค่าสรุปและโค้ชจะแม่นขึ้น");

  if (ws.length >= 2) {
    const a = ws[0], b = ws[ws.length - 1], span = Math.max(1, (parseKey(b.d) - parseKey(a.d)) / 864e5), ch = b.w - a.w, perW = ch / span * 7;
    const fast = perW < -b.w * 0.01, dot = fast ? "🟡" : perW <= -0.2 ? "🟢" : perW <= 0.2 ? "🟡" : "🔴";
    row(dot, "น้ำหนัก", `${sgn(ch)} kg`, `${sgn(perW)} kg/สัปดาห์${fast ? " · ลดเร็วเกิน 1%/สัปดาห์ อาจเสียกล้ามเนื้อ" : perW <= -0.2 ? " · กำลังดี" : perW <= 0.2 ? " · ทรงตัว" : " · เพิ่มขึ้น"}`);
  } else row("⚪", "น้ำหนัก", "–", "ชั่งอย่างน้อย 2 ครั้งในช่วงนี้เพื่อดูแนวโน้ม");
  return `<div class="card"><h2>สรุปแบบเร็ว</h2>${rows.join("")}<div class="muted small" style="margin-top:6px">🟢 ดี · 🟡 พอใช้ · 🔴 ควรปรับ · แคลอรี่/โปรตีนไม่นับวันนี้เพราะวันยังไม่จบ</div></div>`;
}

/* ---- real TDEE from weight trend + logged intake (last 28 complete days) ---- */
function realTdee() {
  const tk = dateKey(), from = shiftDate(tk, -28);
  const L = []; for (let d = from; d < tk; d = shiftDate(d, 1)) if ((state.log[d] || []).length) L.push(d);
  const ws = bodyEntries().filter(e => e.w > 0 && e.d >= from && e.d <= tk);
  const span = ws.length ? Math.round((parseKey(ws[ws.length - 1].d) - parseKey(ws[0].d)) / 864e5) : 0;
  const need = [];
  if (ws.length < 3 || span < 14) need.push(`ชั่งน้ำหนักอย่างน้อย 3 ครั้ง ห่างกันรวม 14 วันขึ้นไป (ตอนนี้ ${ws.length} ครั้ง, ${span} วัน)`);
  if (L.length < 14) need.push(`บันทึกอาหารครบทั้งวันอย่างน้อย 14 วัน (ตอนนี้ ${L.length} วัน)`);
  if (need.length) return { need };
  const t0 = parseKey(ws[0].d).getTime(), xs = ws.map(e => (parseKey(e.d).getTime() - t0) / 864e5), ys = ws.map(e => e.w);
  const mx = xs.reduce((a, b) => a + b, 0) / xs.length, my = ys.reduce((a, b) => a + b, 0) / ys.length;
  const slope = xs.reduce((a, x, i) => a + (x - mx) * (ys[i] - my), 0) / (xs.reduce((a, x) => a + (x - mx) ** 2, 0) || 1);   // kg/วัน
  const avg = L.reduce((a, d) => a + dayTotals(d).kcal, 0) / L.length;
  return { tdee: r0(avg - slope * 7700), avg: r0(avg), perWeek: slope * 7, nW: ws.length, nL: L.length };
}
function tdeeCardHtml() {
  const t = compute(state.profile), r = realTdee();

  if (r.need) return h + `<p class="muted small" style="margin:6px 0">คำนวณจากน้ำหนักที่เปลี่ยนจริงเทียบกับแคลอรี่ที่บันทึกใน 28 วันล่าสุด ซึ่งแม่นกว่าสูตร และชดเชยความคลาดเคลื่อนของ AI ไปในตัว ยังต้องการข้อมูลเพิ่ม:</p><ul class="small">${r.need.map(x => `<li>${x}</li>`).join("")}</ul></div>`;

    <button class="btn block primary" data-act="usetdee" data-v="${r.tdee}">ใช้ ${r.tdee} kcal เป็น TDEE</button></div>`;
}

  el.innerHTML = `<div class="overlay" data-act="overlay"><div class="sheet" role="dialog" aria-modal="true">${body}</div></div>`;
}

/* ============ model picker ============ */
function modelSelectHtml() {
  const s = state.settings, list = s.models || [];
  if (!list.length) return `<label class="fld">ชื่อโมเดล<input data-s="model" value="${esc(s.model)}"></label><div class="muted small" style="margin:-4px 0 8px">ใส่ key แล้วกด "โหลดรายชื่อโมเดล" เพื่อเลือกจากรายการ</div>`;
  const skip = /tts|image|live|audio|embed|transcribe|robotics|computer|lyria|nano|antigravity|research|aqa|gemma/i;
  const names = list.filter(n => /gemini/i.test(n) && !skip.test(n));
  if (s.model && !names.includes(s.model)) names.unshift(s.model);
  const a = modelPrefs().filter(n => names.includes(n)), b = names.filter(n => !a.includes(n)).sort();
  const opt = n => `<option value="${esc(n)}" ${n === s.model ? "selected" : ""}>${esc(n)}</option>`;
  return `<label class="fld">โมเดล AI — ถ้าตัวที่ใช้อยู่มีปัญหา เลือกตัวอื่นแล้วกด "ทดสอบโมเดลนี้"<select data-s="model">${a.length ? `<optgroup label="★ แนะนำ (ทดสอบแล้ว)">${a.map(opt).join("")}</optgroup>` : ""}${b.length ? `<optgroup label="โมเดลอื่นๆ">${b.map(opt).join("")}</optgroup>` : ""}</select></label>`;
}
async function testModel() {
  const m = state.settings.model || modelPrefs()[0], t0 = Date.now();
  await gemCall(m, [{ role: "user", parts: [{ text: "ตอบสั้นๆ ว่า ok" }] }], {}, null, 30000);
  return { m, secs: ((Date.now() - t0) / 1000).toFixed(1) };
}
let modelsLoading = false;
function autoModels() {   // โหลดรายชื่อโมเดลให้เองเมื่อมี key แต่ยังไม่มีรายการ
  if (modelsLoading || !state.settings.key || (state.settings.models || []).length) return;
  modelsLoading = true;
  loadModels().then(names => {
    state.settings.models = names; store.set(K.settings, state.settings);
    const mb = $("#modelBox"); if (mb && !(mb.contains(document.activeElement))) mb.innerHTML = modelSelectHtml();
  }).catch(() => {}).finally(() => { modelsLoading = false; });
}

/* ============ main render ============ */
function render() {
  $("#app").innerHTML = state.tab === "today" ? renderToday() : state.tab === "report" ? renderReport() : renderProfile();
  document.querySelectorAll("nav .tab").forEach(b => b.classList.toggle("on", b.dataset.tab === state.tab));
  if (state.tab === "profile") autoModels();
}

/* ============ actions ============ */
const blankItem = () => ({ name: "", portion: "", kcal: 0, p: 0, f: 0, c: 0, fib: 0, sug: 0, na: 0 });
const cleanItems = items => items.filter(i => String(i.name).trim() || num(i.kcal) > 0).map(i => ({ name: String(i.name).trim(), portion: String(i.portion || "").trim(), kcal: r0(num(i.kcal)), p: r1(num(i.p)), f: r1(num(i.f)), c: r1(num(i.c)), fib: r1(num(i.fib)), sug: r1(num(i.sug)), na: r0(num(i.na)) }));
function openDraft(kind, extra) {
  const time = timeNow();
  const base = { kind, hint: "", time, thumb: "", images: [], mode: "", status: "", error: "", notes: "", confidence: "", range: null, date: state.date };
  state.draft = Object.assign(base, kind === "ex" ? { type: "cardio", name: "", minutes: 0, kcal: 0, detail: "" } : { items: [], mtype: typeFromTime(time), typeTouched: false }, extra);
  renderModal();
}
async function runAnalysis() {
  const d = state.draft; if (!d || (d.kind !== "food" && d.kind !== "ex")) return;
  const imgs = d.images.length ? d.images : (d.thumb ? [d.thumb] : []);
  if (!imgs.length && !d.hint.trim()) { d.error = "ใส่รูปหรือพิมพ์คำอธิบายก่อนให้ AI วิเคราะห์"; renderModal(); return; }
  d.status = "analyzing"; d.error = ""; d.stage = ""; d.t0 = Date.now(); renderModal();
  aiProgress = msg => { if (state.draft !== d) return; d.stage = msg; const el = $("#aiStage"); if (el) el.textContent = msg; };
  const tick = setInterval(() => { const el = $("#aiSec"); if (state.draft !== d || d.status !== "analyzing") return clearInterval(tick); if (el) el.textContent = Math.round((Date.now() - d.t0) / 1000) + " วิ"; }, 1000);
  try {
    // เก็บคำขอไว้ใน d.job: ถ้าผู้ใช้กด "ไม่รอแล้ว บันทึกไว้ก่อน" ระหว่างรอ จะใช้ผลของคำขอนี้ต่อ ไม่ต้องเรียก AI ซ้ำ
    if (d.kind === "ex") {
      d.job = analyzeExercise(imgs, d.hint.trim());
      const r = await d.job;
      if (state.draft !== d) return;
      Object.assign(d, { type: r.type, name: r.name, minutes: r.minutes, kcal: r.kcal, detail: r.detail, notes: r.notes });
    } else {
      d.job = analyzeFood(imgs, d.hint.trim(), d.mode);
      const r = await d.job;
      if (state.draft !== d) return;
      d.items = r.items; d.notes = r.notes; d.confidence = r.confidence; d.range = r.range; d.sources = r.sources; d.webTried = r.webTried;
    }
  } catch (e) {
    if (state.draft !== d) return;
    d.error = e.message; if (d.kind === "food" && !d.items.length) d.items = [blankItem()];
  }
  clearInterval(tick); aiProgress = () => {};
  d.status = ""; renderModal();
}
async function onFiles(fileList) {
  const files = [...(fileList || [])].slice(0, MAX_IMG); if (!files.length) return;
  const mode = state.pickMode;
  try {
    const imgs = []; for (const f of files) imgs.push(await loadImage(f));
    // 800px พอสำหรับดูอาหาร และส่งขึ้นเร็วกว่าบนเน็ตมือถือ
    const bigs = imgs.map(i => scaled(i, 800, 0.8)), thumb = scaled(imgs[0], 200, 0.55);
    const cur = state.draft;
    if (mode === "append" && cur && (cur.kind === "food" || cur.kind === "ex")) {
      const room = MAX_IMG - cur.images.length;
      cur.images = cur.images.concat(bigs.slice(0, room));
      if (!cur.thumb) cur.thumb = thumb;
      cur.error = ""; renderModal();
      toast(bigs.length > room ? `ใส่ได้สูงสุด ${MAX_IMG} รูป` : "เพิ่มรูปแล้ว · กดปุ่มวิเคราะห์เมื่อพร้อม");
      return;
    }
    const kind = mode === "ex" ? "ex" : "food";
    openDraft(kind, { images: bigs, thumb, mode: mode === "label" ? "label" : "" });
    if (!state.settings.key) {
      if (kind === "food") state.draft.items = [blankItem()];
      state.draft.error = "ยังไม่ได้ใส่ Gemini API key (แท็บโปรไฟล์) — กรอกเองได้ หรือใส่ key แล้วกด 'ให้ AI วิเคราะห์'"; renderModal(); return;
    }
    // ไม่วิเคราะห์อัตโนมัติ: รอผู้ใช้เพิ่มรูป/คำอธิบายแล้วกดปุ่มวิเคราะห์เอง
    const ta = document.querySelector('#modal textarea[data-d="hint"]'); if (ta) try { ta.focus({ preventScroll: true }); } catch (e) {}
  } catch (e) { toast(e.message); }
}
function saveDraft() {
  const d = state.draft;
  if (d.kind === "body") {
    const w = num(d.bw), bf = num(d.bbf), date = d.bdate || dateKey();
    if (!(w > 0) && !(bf > 0)) { toast("ใส่น้ำหนักหรือ %FAT อย่างน้อยหนึ่งค่า"); return; }
    if (w > 400 || bf >= 70) { toast("ค่าดูไม่ถูกต้อง ตรวจสอบอีกครั้ง"); return; }
    state.body[date] = { w: w > 0 ? r1(w) : 0, bf: bf > 0 ? r1(bf) : 0 };
    persist(K.body, state.body);
    const latest = Object.keys(state.body).sort().pop() === date;
    if (latest) { if (w > 0) state.profile.weight = r1(w); if (bf > 0) state.profile.bf = r1(bf); store.set(K.profile, state.profile); }
    state.draft = null; renderModal(); render(); toast(latest ? "บันทึกแล้ว · อัปเดตเป้าหมายตามค่าล่าสุด" : "บันทึกแล้ว");
    return;
  }
  if (d.kind === "ex") {
    const e = { id: d.id || uid(), time: d.time || timeNow(), type: d.type, name: String(d.name).trim(), minutes: r0(num(d.minutes)), kcal: r0(num(d.kcal)), detail: String(d.detail).trim(), thumb: d.thumb };
    if (!e.name && !e.minutes && !e.detail) { toast("ใส่ชื่อ เวลา หรือรายละเอียดอย่างน้อยหนึ่งอย่าง"); return; }
    const list = state.ex[d.date] || (state.ex[d.date] = []);
    const idx = list.findIndex(x => x.id === e.id); if (idx >= 0) list[idx] = e; else list.push(e);
    saveEx();
  } else {
    const items = cleanItems(d.items);
    if (!items.length) { toast("ยังไม่มีรายการอาหาร"); return; }
    const meal = { id: d.id || uid(), time: d.time || timeNow(), type: MT[d.mtype] ? d.mtype : typeFromTime(d.time), thumb: d.thumb, items };
    const list = state.log[d.date] || (state.log[d.date] = []);
    const idx = list.findIndex(m => m.id === meal.id); if (idx >= 0) list[idx] = meal; else list.push(meal);
    saveLog();
  }
  state.draft = null; renderModal(); render(); toast("บันทึกแล้ว");
  scheduleCoach(d.date);
}

/* ---- โค้ชอัตโนมัติ: รวมการบันทึกที่ติดกันเป็นคำขอเดียว และรอให้มื้อที่ค้างวิเคราะห์เสร็จก่อน (ประหยัดโควตาฟรี) ---- */
let coachTimer = null;
function scheduleCoach(date) {
  if (state.settings.autoCoach === false || !state.settings.key) return;
  clearTimeout(coachTimer);
  coachTimer = setTimeout(() => { if (!hasPendingOn(date)) coachDay(date, true); }, 10000);
}
const hasPendingOn = d => (state.log[d] || []).some(m => m.pending) || (state.ex[d] || []).some(e => e.pending);

/* ---- บันทึกไว้ก่อน แล้วให้ AI วิเคราะห์เบื้องหลัง (ไม่ต้องรอ / ลองใหม่เองเมื่อเซิร์ฟเวอร์ว่าง) ---- */
const softRender = () => { if (state.tab !== "profile") render(); };   // ไม่รีเฟรชหน้าโปรไฟล์ระหว่างพิมพ์
const pendingBusy = new Set();
function savePending() {
  const d = state.draft; if (!d || (d.kind !== "food" && d.kind !== "ex")) return;
  const imgs = d.images.length ? d.images : (d.thumb ? [d.thumb] : []);
  if (!imgs.length && !String(d.hint || "").trim()) { toast("ใส่รูปหรือคำอธิบายก่อน"); return; }
  const pending = { kind: d.kind, images: imgs, hint: String(d.hint || "").trim(), mode: d.mode || "", tries: 0, err: "", next: 0 };
  const id = d.id || uid(), time = d.time || timeNow(), date = d.date;
  let entry;
  if (d.kind === "ex") {
    entry = { id, time, type: d.type || "other", name: "", minutes: 0, kcal: 0, detail: "", thumb: d.thumb, pending };
    const list = state.ex[date] || (state.ex[date] = []); const i = list.findIndex(x => x.id === id); if (i >= 0) list[i] = entry; else list.push(entry);
    saveEx();
  } else {
    entry = { id, time, type: MT[d.mtype] ? d.mtype : typeFromTime(time), thumb: d.thumb, items: [], pending };
    const list = state.log[date] || (state.log[date] = []); const i = list.findIndex(x => x.id === id); if (i >= 0) list[i] = entry; else list.push(entry);
    saveLog();
  }
  const job = d.status === "analyzing" ? d.job : null;   // กำลังวิเคราะห์อยู่ → ใช้ผลของคำขอนั้นต่อ ไม่ต้องเรียกใหม่
  state.draft = null; renderModal(); render();
  toast("บันทึกแล้ว · AI จะวิเคราะห์ให้เบื้องหลัง");
  if (job) {
    pendingBusy.add(id); softRender();
    job.then(r => applyPending(date, id, d.kind, r))
      .catch(e => { const x = findEntry(date, id, d.kind); if (x && x.pending) { x.pending.tries++; x.pending.err = e.message; x.pending.next = Date.now() + 30000; d.kind === "ex" ? saveEx() : saveLog(); } })
      .finally(() => { pendingBusy.delete(id); softRender(); });
  } else processPending();
}
const findEntry = (date, id, kind) => ((kind === "ex" ? state.ex : state.log)[date] || []).find(x => x.id === id);
function applyPending(date, id, kind, r) {
  const x = findEntry(date, id, kind); if (!x || !x.pending) return false;   // ผู้ใช้แก้/ลบไปแล้ว
  if (kind === "ex") Object.assign(x, { type: r.type, name: r.name, minutes: r.minutes, kcal: r.kcal, detail: r.detail });
  else { const items = cleanItems(r.items); if (!items.length) throw new Error("AI ไม่พบรายการอาหาร"); x.items = items; }
  delete x.pending;
  kind === "ex" ? saveEx() : saveLog();
  toast(`✅ AI วิเคราะห์เสร็จ: ${kind === "ex" ? (x.name || "ออกกำลังกาย") : mealName(x)}`);
  softRender(); scheduleCoach(date);
  return true;
}
let pendingRunning = false;
async function processPending(force) {
  if (pendingRunning || !state.settings.key || (typeof navigator !== "undefined" && navigator.onLine === false)) return;
  if (state.draft && state.draft.status === "analyzing") return;   // ไม่แย่งโควตากับที่ผู้ใช้กำลังรออยู่
  const jobs = [];
  [["food", state.log], ["ex", state.ex]].forEach(([kind, col]) => Object.keys(col).forEach(date => (col[date] || []).forEach(x => {
    if (x.pending && !pendingBusy.has(x.id) && (force || !(x.pending.next > Date.now()))) jobs.push({ kind, date, x });
  })));
  if (!jobs.length) return;
  pendingRunning = true;
  try {
    for (const { kind, date, x } of jobs) {
      if (!x.pending) continue;
      pendingBusy.add(x.id); softRender();
      try {
        const p = x.pending;
        const r = kind === "ex" ? await analyzeExercise(p.images, p.hint) : await analyzeFood(p.images, p.hint, p.mode);
        applyPending(date, x.id, kind, r);
      } catch (e) {
        if (x.pending) {
          x.pending.tries++; x.pending.err = e.message;
          x.pending.next = Date.now() + Math.min(10 * 60000, 30000 * 2 ** Math.min(x.pending.tries - 1, 5));   // 30 วิ → 1 → 2 → 4 → 8 → 10 นาที
          kind === "ex" ? saveEx() : saveLog();
        }
        if (e.status === 429 || e.status === 400 || e.status === 401 || e.status === 403) break;   // โควตาหมด/key มีปัญหา → พักไว้ก่อน
      } finally { pendingBusy.delete(x.id); softRender(); }
    }
  } finally { pendingRunning = false; }
}
setInterval(() => { if (!document.hidden) processPending(); }, 60000);
window.addEventListener("online", () => processPending());
document.addEventListener("visibilitychange", () => { if (!document.hidden) processPending(); });
function shiftReport(dir) {
  const R = state.rep, dt = parseKey(R.anchor);
  R.anchor = R.range === "week" ? shiftDate(R.anchor, 7 * dir) : dateKey(new Date(dt.getFullYear(), dt.getMonth() + dir, 1));
}
const copyItems = items => items.map(i => Object.assign(blankItem(), i));

document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act, d = state.draft;
  if (a === "overlay") { if (e.target === t && d && (d.kind === "choose" || d.kind === "share")) { state.draft = null; renderModal(); } return; }
  if (a === "tab") { state.tab = t.dataset.tab; render(); window.scrollTo(0, 0); }
  else if (a === "day") { state.date = shiftDate(state.date, +t.dataset.d); render(); }
  else if (a === "gotoday") { state.date = dateKey(); render(); }
  else if (a === "range") { state.rep.range = t.dataset.r; render(); }
  else if (a === "rnav") { shiftReport(+t.dataset.d); render(); }
  else if (a === "godate") { state.date = t.dataset.date; state.tab = "today"; render(); window.scrollTo(0, 0); }
  else if (a === "add") { state.draft = { kind: "choose" }; renderModal(); }
  else if (a === "pick") { state.pickMode = t.dataset.mode || "food"; const inp = $(t.dataset.cam ? "#fileCam" : "#fileLib"); inp.value = ""; inp.click(); }
  else if (a === "manual") { if (t.dataset.mode === "ex") openDraft("ex"); else openDraft("food", { items: [blankItem()] }); }
  else if (a === "cancel") { state.draft = null; renderModal(); }
  else if (a === "analyze") runAnalysis();
  else if (a === "additem") { d.items.push(blankItem()); renderModal(); }
  else if (a === "rmitem") { d.items.splice(+t.dataset.i, 1); renderModal(); }
  else if (a === "rmimg") {
    if (d.images.length) { d.images.splice(+t.dataset.i, 1); if (!d.images.length && !d.id) d.thumb = ""; } else d.thumb = "";
    renderModal();
  }
  else if (a === "save") saveDraft();
  else if (a === "savefav") {
    const items = cleanItems(d.items);
    if (!items.length) { toast("ยังไม่มีรายการอาหารให้เก็บ"); return; }
    const name = items.map(i => i.name).filter(Boolean).join(", ").slice(0, 80) || "เมนูประจำ";
    const i = state.fav.findIndex(f => f.name === name), fav = { id: i >= 0 ? state.fav[i].id : uid(), name, items };
    if (i >= 0) state.fav[i] = fav; else state.fav.unshift(fav);
    persist(K.fav, state.fav); toast(i >= 0 ? "อัปเดตเมนูประจำแล้ว" : "เก็บเป็นเมนูประจำแล้ว · เรียกใช้ได้จากปุ่ม ＋");
  }
  else if (a === "usefav") { const f = state.fav.find(x => x.id === t.dataset.id); if (f) openDraft("food", { items: copyItems(f.items) }); }
  else if (a === "delfav") {
    if (!confirm("ลบเมนูประจำนี้?")) return;
    state.fav = state.fav.filter(x => x.id !== t.dataset.id); persist(K.fav, state.fav); renderModal();
  }
  else if (a === "usemeal") { const m = (state.log[t.dataset.date] || []).find(x => x.id === t.dataset.id); if (m) openDraft("food", { items: copyItems(m.items) }); }
  else if (a === "edit") {
    const m = (state.log[state.date] || []).find(x => x.id === t.dataset.id); if (!m) return;
    const pe = m.pending ? { images: m.pending.images.slice(), hint: m.pending.hint, mode: m.pending.mode, items: [] } : {};
    openDraft("food", Object.assign({ id: m.id, time: m.time, thumb: m.thumb || "", items: copyItems(m.items), mtype: mealType(m), typeTouched: true }, pe));
  }
  else if (a === "editex") {
    const x = (state.ex[state.date] || []).find(v => v.id === t.dataset.id); if (!x) return;
    const pe = x.pending ? { images: x.pending.images.slice(), hint: x.pending.hint } : {};
    openDraft("ex", Object.assign({ id: x.id, time: x.time, thumb: x.thumb || "", type: x.type, name: x.name, minutes: x.minutes, kcal: x.kcal, detail: x.detail }, pe));
  }
  else if (a === "later") savePending();
  else if (a === "retrypend") {
    [state.log, state.ex].forEach(col => Object.values(col).forEach(list => (list || []).forEach(x => { if (x.id === t.dataset.id && x.pending) x.pending.next = 0; })));
    if (pendingRunning) toast("กำลังวิเคราะห์รายการอื่นอยู่ · จะทำรายการนี้ต่อให้");
    processPending();
  }
  else if (a === "del") {
    if (!confirm("ลบมื้อนี้?")) return;
    state.log[state.date] = (state.log[state.date] || []).filter(m => m.id !== t.dataset.id);
    if (!state.log[state.date].length) delete state.log[state.date];
    saveLog(); render();
  }
  else if (a === "delex") {
    if (!confirm("ลบการออกกำลังกายนี้?")) return;
    state.ex[state.date] = (state.ex[state.date] || []).filter(m => m.id !== t.dataset.id);
    if (!state.ex[state.date].length) delete state.ex[state.date];
    saveEx(); render();
  }
  else if (a === "addbody") { state.draft = { kind: "body", bdate: dateKey(), bw: "", bbf: "" }; renderModal(); }
  else if (a === "delbody") {
    if (!confirm(`ลบค่าน้ำหนัก/%FAT ของวันที่ ${fmtShort(t.dataset.date)}?`)) return;
    delete state.body[t.dataset.date]; persist(K.body, state.body); render();
  }
  else if (a === "coach") coachDay(state.date, false);
  else if (a === "coachp") coachPeriod();
  else if (a === "share") shareDay();
  else if (a === "clear") {
    if (!confirm("ลบบันทึกอาหารและออกกำลังกายทั้งหมดถาวร? (ไม่ลบโปรไฟล์ น้ำหนัก และเมนูประจำ) ย้อนกลับไม่ได้ — แนะนำสำรองก่อน")) return;
    state.log = {}; state.ex = {}; state.coach = {}; saveLog(); saveEx(); persist(K.coach, state.coach); render(); toast("ลบแล้ว");
  }
  else if (a === "export") { exportData(); render(); }
  else if (a === "usetdee") {
    const v = r0(num(t.dataset.v)); if (v < 800 || v > 6000) return;
    if (!confirm(`ตั้ง TDEE เป็น ${v} kcal? (แก้หรือลบได้ที่แท็บโปรไฟล์ ช่อง "TDEE จากเครื่องชั่ง/ที่วัดเอง")`)) return;
    state.profile.tdeeOverride = v; store.set(K.profile, state.profile); render(); toast(`ตั้ง TDEE เป็น ${v} kcal แล้ว · เป้าแคลอรี่อัปเดตแล้ว`);
  }
  else if (a === "backuplater") { state.settings.backupAsk = dateKey(); store.set(K.settings, state.settings); render(); }
  else if (a === "csvdaily") download(`foodapp-daily-${dateKey()}.csv`, csvDaily(), "text/csv;charset=utf-8");
  else if (a === "csvitems") download(`foodapp-items-${dateKey()}.csv`, csvItems(), "text/csv;charset=utf-8");
  else if (a === "import") { const inp = $("#fileImp"); inp.value = ""; inp.click(); }
  else if (a === "loadmodels") {
    t.disabled = true; const old = t.textContent; t.textContent = "กำลังโหลด...";
    try {
      const names = await loadModels();
      state.settings.models = names; store.set(K.settings, state.settings);
      const mb = $("#modelBox"); if (mb) mb.innerHTML = modelSelectHtml();
      toast(`key ใช้งานได้ · พบ ${names.length} โมเดล เลือกจากรายการได้เลย`);
    } catch (err) { toast(err.message); }
    t.disabled = false; t.textContent = old;
  }
  else if (a === "testmodel") {
    t.disabled = true; const old = t.textContent; t.textContent = "กำลังทดสอบ...";
    try { const r = await testModel(); toast(`✅ ${r.m} ใช้งานได้ (ตอบใน ${r.secs} วินาที)`); }
    catch (err) { toast("❌ " + err.message); }
    t.disabled = false; t.textContent = old;
  }
});
document.addEventListener("input", e => {
  const t = e.target, d = state.draft;
  if (t.dataset.f) {
    state.profile[t.dataset.f] = t.dataset.f === "activity" ? num(t.value) : t.value;
    store.set(K.profile, state.profile);
    const s = $("#summary"); if (s) s.innerHTML = summaryHtml();
  } else if (t.dataset.sc) {
    state.settings[t.dataset.sc] = t.checked; store.set(K.settings, state.settings);
  } else if (t.dataset.s) {
    state.settings[t.dataset.s] = t.value.trim(); store.set(K.settings, state.settings);
  } else if (t.dataset.d && d) {
    const k = t.dataset.d; d[k] = (k === "minutes" || k === "kcal") ? num(t.value) : t.value;
    if (k === "mtype") d.typeTouched = true;
    if (k === "time" && d.kind === "food" && !d.typeTouched) { d.mtype = typeFromTime(t.value); const sel = $('select[data-d="mtype"]'); if (sel) sel.value = d.mtype; }
  } else if (t.dataset.i !== undefined && d) {
    const it = d.items[+t.dataset.i], k = t.dataset.k;
    it[k] = (k === "name" || k === "portion") ? t.value : num(t.value);
    if (k === "p" || k === "f" || k === "c") {
      it.kcal = r0(it.p * 4 + it.c * 4 + it.f * 9);
      const kc = $(`input[data-i="${t.dataset.i}"][data-k="kcal"]`); if (kc) kc.value = it.kcal;
    }
    const tt = $("#draftTotal"); if (tt) tt.innerHTML = totalHtml(mealTotals(d));
  }
});
document.addEventListener("change", e => { if (e.target.tagName === "SELECT") e.target.dispatchEvent(new Event("input", { bubbles: true })); });
$("#fileCam").addEventListener("change", e => onFiles(e.target.files));
$("#fileLib").addEventListener("change", e => onFiles(e.target.files));
$("#fileImp").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (!j || j.app !== "foodapp" || typeof j.log !== "object") throw new Error("bad");
    if (!confirm("นำเข้าข้อมูลจากไฟล์สำรอง? ข้อมูลในเครื่องนี้ (บันทึกอาหาร ออกกำลังกาย น้ำหนัก เมนูประจำ) จะถูกแทนที่")) return;
    const c = sanitizeBackup(j);
    state.log = c.log; state.ex = c.ex; state.coach = c.coach; state.body = c.body; state.fav = c.fav;
    persist(K.coach, state.coach); persist(K.body, state.body); persist(K.fav, state.fav);
    if (c.profile) { state.profile = c.profile; store.set(K.profile, state.profile); }
    saveLog(); saveEx(); render(); toast("นำเข้าข้อมูลแล้ว");
  } catch (err) { toast("ไฟล์สำรองไม่ถูกต้อง"); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && state.draft) { state.draft = null; renderModal(); } });

if (!compute(state.profile)) state.tab = "profile";
render();
setTimeout(() => processPending(true), 1500);   // เปิดแอปแล้ววิเคราะห์มื้อที่ค้างไว้ให้ทันที
</script>
